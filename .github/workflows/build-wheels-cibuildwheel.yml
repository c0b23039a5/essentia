name: Build Python wheels (cibuildwheel)

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build wheels on Linux and macOS to keep both cibuildwheel
          # configuration paths validated in CI.
          - os: ubuntu-latest
            config: cibuildwheel
          - os: ubuntu-latest
            config: cibuildwheel-tensorflow
          - os: macos-26
            config: cibuildwheel
          - os: macos-26
            config: cibuildwheel-tensorflow
          - os: macos-26-intel
            config: cibuildwheel
          - os: macos-26-intel
            config: cibuildwheel-tensorflow
          # Run actual Windows builds on both images, restricted to amd64.
          - os: windows-2025
            config: cibuildwheel
          - os: windows-2025-vs2026
            config: cibuildwheel

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch release tags from GitHub
        # Workaround for https://github.com/actions/checkout/issues/290
        run: git fetch --tags --force

      # Used to host cibuildwheel
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.4.0

      - name: Build wheels (Windows amd64 only)
        if: ${{ startsWith(matrix.os, 'windows') }}
        env:
          CIBW_BUILD: "*-win_amd64"
        run: python -m cibuildwheel . --output-dir wheelhouse --config-file ${{ matrix.config }}.toml

      - name: Build wheels
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: python -m cibuildwheel . --output-dir wheelhouse --config-file ${{ matrix.config }}.toml

      - uses: actions/upload-artifact@v6
        with:
          path: ./wheelhouse/*.whl
          name: artifact-${{ matrix.os }}-${{ matrix.config }}
