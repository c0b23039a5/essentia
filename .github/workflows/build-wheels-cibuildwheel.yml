name: Build Python wheels (cibuildwheel)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build wheels on Linux and macOS to keep both cibuildwheel
          # configuration paths validated in CI.
          - os: ubuntu-latest
            config: cibuildwheel
          - os: ubuntu-latest
            config: cibuildwheel-tensorflow
          - os: macos-26
            config: cibuildwheel
          - os: macos-26
            config: cibuildwheel-tensorflow
          - os: macos-26-intel
            config: cibuildwheel
          - os: macos-26-intel
            config: cibuildwheel-tensorflow
          # Build wheels on both Windows images too.
          - os: windows-2025
            config: cibuildwheel
          - os: windows-2025-vs2026
            config: cibuildwheel

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch release tags from GitHub
        # Workaround for https://github.com/actions/checkout/issues/290
        run: git fetch --tags --force

      # Used to host cibuildwheel
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Initialize MSVC developer command prompt
        if: ${{ startsWith(matrix.os, 'windows') }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.4.0


      - name: Prepare Windows pkg-config dependencies
        if: ${{ startsWith(matrix.os, 'windows') }}
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          if (-not (Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          }
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat')
          & (Join-Path $vcpkgRoot 'vcpkg.exe') install --triplet x64-windows `
            eigen3 fftw3 libsamplerate taglib libyaml ffmpeg pkgconf

          $vcpkgInstalled = Join-Path $vcpkgRoot 'installed/x64-windows'
          $eigenInclude = Join-Path $vcpkgInstalled 'include/eigen3'
          if (-not (Test-Path (Join-Path $eigenInclude 'unsupported/Eigen/CXX11/Tensor'))) {
            throw "vcpkg Eigen install does not contain unsupported/Eigen/CXX11/Tensor ($eigenInclude)."
          }
          $eigenIncludePosix = $eigenInclude -replace '\\', '/'

          $pcDir = Join-Path $env:RUNNER_TEMP 'essentia-pkgconfig'
          New-Item -ItemType Directory -Force -Path $pcDir | Out-Null

          @(
            'Name: eigen3',
            'Description: Eigen3',
            'Version: latest',
            "Cflags: -I$eigenIncludePosix"
          ) | Out-File -FilePath (Join-Path $pcDir 'eigen3.pc') -Encoding ascii

          $pkgConfigPaths = @(
            $pcDir,
            (Join-Path $vcpkgInstalled 'lib/pkgconfig'),
            (Join-Path $vcpkgInstalled 'share/pkgconfig')
          ) -join ';'

          $windowsIncludePaths = @(
            (Join-Path $vcpkgInstalled 'include'),
            $eigenInclude
          ) -join ';'

          $windowsLibPaths = @(
            (Join-Path $vcpkgInstalled 'lib')
          ) -join ';'

          $pkgconfDir = Join-Path $vcpkgInstalled 'tools/pkgconf'
          $pkgconfExe = Join-Path $pkgconfDir 'pkgconf.exe'
          $pkgConfigExe = Join-Path $pkgconfDir 'pkg-config.exe'
          if ((Test-Path $pkgconfExe) -and (-not (Test-Path $pkgConfigExe))) {
            Copy-Item -Path $pkgconfExe -Destination $pkgConfigExe
          }

          "ESSENTIA_WINDOWS_PKG_CONFIG_PATH=$pkgConfigPaths" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ESSENTIA_WINDOWS_EIGEN_INCLUDE=$eigenInclude" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ESSENTIA_WINDOWS_INCLUDE_PATHS=$windowsIncludePaths" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ESSENTIA_WINDOWS_LIB_PATHS=$windowsLibPaths" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ESSENTIA_WINDOWS_PKG_CONFIG_DIR=$pkgconfDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ESSENTIA_WINDOWS_PKG_CONFIG_EXE=$pkgConfigExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build wheels (Windows amd64 only)
        id: build_windows
        if: ${{ startsWith(matrix.os, 'windows') }}
        env:
          CIBW_BUILD: "cp312-win_amd64 cp313-win_amd64 cp314-win_amd64"
          ESSENTIA_WHEEL_SKIP_3RDPARTY: "0"
          PKG_CONFIG: ${{ env.ESSENTIA_WINDOWS_PKG_CONFIG_EXE }}
          PKG_CONFIG_PATH: ${{ env.ESSENTIA_WINDOWS_PKG_CONFIG_PATH }}
          PATH: ${{ env.ESSENTIA_WINDOWS_PKG_CONFIG_DIR }};${{ env.PATH }}
          INCLUDE: ${{ env.ESSENTIA_WINDOWS_INCLUDE_PATHS }};${{ env.ESSENTIA_WINDOWS_EIGEN_INCLUDE }};${{ env.INCLUDE }}
          LIB: ${{ env.ESSENTIA_WINDOWS_LIB_PATHS }};${{ env.LIB }}
          CXXFLAGS: /I"${{ env.ESSENTIA_WINDOWS_EIGEN_INCLUDE }}"
          CFLAGS: /I"${{ env.ESSENTIA_WINDOWS_EIGEN_INCLUDE }}"
        run: python -m cibuildwheel . --output-dir wheelhouse --config-file ${{ matrix.config }}.toml

      - name: Build wheels
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: python -m cibuildwheel . --output-dir wheelhouse --config-file ${{ matrix.config }}.toml

      - uses: actions/upload-artifact@v6
        if: ${{ !startsWith(matrix.os, 'windows') || steps.build_windows.outcome == 'success' }}
        with:
          path: ./wheelhouse/*.whl
          name: artifact-${{ matrix.os }}-${{ matrix.config }}
