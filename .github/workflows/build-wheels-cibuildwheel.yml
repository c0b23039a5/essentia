name: Build Python wheels (cibuildwheel)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build_wheels:
    name: ${{ matrix.config }} / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
            cibw_arch: x86_64
            config: cibuildwheel
            cibw_platform: linux
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
            cibw_arch: x86_64
            config: cibuildwheel-tensorflow
            cibw_platform: linux
          - runner: windows-latest
            os: windows
            arch: x86_64
            cibw_arch: AMD64
            config: cibuildwheel
            cibw_platform: windows
          - runner: windows-11-arm
            os: windows
            arch: arm64
            cibw_arch: ARM64
            config: cibuildwheel
            cibw_platform: windows

          # Disabled to reduce CI minutes while these combinations are unsupported/unreliable.
          # - runner: ubuntu-24.04-arm
          #   os: linux
          #   arch: arm64
          #   cibw_arch: arm64
          #   config: cibuildwheel
          # - runner: ubuntu-24.04-arm
          #   os: linux
          #   arch: arm64
          #   cibw_arch: arm64
          #   config: cibuildwheel-tensorflow
          # - runner: windows-latest
          #   os: windows
          #   arch: x86_64
          #   cibw_arch: AMD64
          #   config: cibuildwheel-tensorflow
          # - runner: windows-11-arm
          #   os: windows
          #   arch: arm64
          #   cibw_arch: ARM64
          #   config: cibuildwheel-tensorflow
          # - runner: macos-15-intel
          #   os: macos
          #   arch: x86_64
          #   cibw_arch: x86_64
          #   config: cibuildwheel
          # - runner: macos-15-intel
          #   os: macos
          #   arch: x86_64
          #   cibw_arch: x86_64
          #   config: cibuildwheel-tensorflow
          # - runner: macos-latest
          #   os: macos
          #   arch: arm64
          #   cibw_arch: arm64
          #   config: cibuildwheel
          # - runner: macos-latest
          #   os: macos
          #   arch: arm64
          #   cibw_arch: arm64
          #   config: cibuildwheel-tensorflow

    env:
      CIBW_ARCHS_LINUX: ${{ matrix.os == 'linux' && matrix.cibw_arch || '' }}
      CIBW_ARCHS_WINDOWS: ${{ matrix.os == 'windows' && matrix.cibw_arch || '' }}
      CIBW_ARCHS_MACOS: ${{ matrix.os == 'macos' && matrix.cibw_arch || '' }}
      CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch release tags from GitHub
        run: git fetch --tags --force

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip "cibuildwheel==3.4.0"

      - name: Build wheels
        run: python -m cibuildwheel --config-file "${{ matrix.config }}.toml" --platform "${{ matrix.cibw_platform }}" --output-dir wheelhouse

      - uses: actions/upload-artifact@v6
        with:
          path: ./wheelhouse/*.whl
          name: wheels-${{ matrix.config }}-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
