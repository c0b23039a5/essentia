[tool.cibuildwheel.linux]

skip = ["*-musllinux*", "*i686", "*cp38*", "*cp3??t*"]

environment = { PROJECT_NAME="essentia", ESSENTIA_PROJECT_NAME="${PROJECT_NAME}", ESSENTIA_WHEEL_SKIP_3RDPARTY=1, ESSENTIA_WHEEL_ONLY_PYTHON=0, PKG_CONFIG_PATH="/project/.cibw-cache/essentia-static-deps/lib/pkgconfig:/project/.cibw-cache/essentia-static-deps/lib64/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig" }

before-all = [
  "PYBIN=$(ls -1 /opt/python/cp3*-cp3*/bin/python | head -n 1)",
  "mkdir -p /project/.cibw-cache/essentia-static-deps",
  "if [ ! -f /project/.cibw-cache/essentia-static-deps/lib/pkgconfig/fftw3f.pc ]; then PREFIX=/project/.cibw-cache/essentia-static-deps bash packaging/build_3rdparty_static_debian.sh; else echo 'Using cached Linux static dependencies from /project/.cibw-cache/essentia-static-deps'; fi",
  "\"${PYBIN}\" waf configure --build-static --static-dependencies --pkg-config-path=\"/project/.cibw-cache/essentia-static-deps/lib/pkgconfig:/project/.cibw-cache/essentia-static-deps/lib64/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}\"",
  "echo 'Note: libyaml pkg-config module is yaml-0.1 (ABI name); resolved version can be 0.2.x'",
  "echo 'Resolved dependency versions (pkg-config)' && for dep in eigen3 yaml-0.1 fftw3f libavcodec libavformat libavutil libswresample samplerate taglib libchromaprint; do if pkg-config --exists \"$dep\"; then echo \"$dep=$(pkg-config --modversion \"$dep\")\"; else echo \"$dep=not found\"; fi; done",
  "\"${PYBIN}\" waf",
  "\"${PYBIN}\" waf install"
]

test-command = "python -c \"import essentia; import essentia.standard; import essentia.streaming; from essentia.standard import MonoLoader, MetadataReader, YamlInput, Chromaprinter\""


[tool.cibuildwheel.macos]

skip = ["*cp38*", "*cp3??t*"]

environment = { PROJECT_NAME="essentia", ESSENTIA_PROJECT_NAME="${PROJECT_NAME}", ESSENTIA_WHEEL_SKIP_3RDPARTY=1, ESSENTIA_WHEEL_ONLY_PYTHON=0, MACOSX_DEPLOYMENT_TARGET=26.0, PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig" }

before-all = [
  "brew install pkg-config gcc readline sqlite gdbm freetype libpng",
  "brew install eigen@3 libyaml fftw ffmpeg libsamplerate libtag",
  "brew install chromaprint",
  "echo 'Resolved dependency versions (brew)' && brew list --versions eigen@3 libyaml fftw ffmpeg libsamplerate libtag chromaprint",
  "echo 'Note: libyaml pkg-config module is yaml-0.1 (ABI name); resolved version can be 0.2.x'",
  "echo 'Resolved dependency versions (pkg-config)' && for dep in eigen3 yaml-0.1 fftw3f libavcodec libavformat libavutil libswresample samplerate taglib libchromaprint; do if pkg-config --exists \"$dep\"; then echo \"$dep=$(pkg-config --modversion \"$dep\")\"; else echo \"$dep=not found\"; fi; done",
  #"brew tap MTG/essentia",
  #"brew install gaia --HEAD",
  # Override VIRTUAL_ENV set by cibuildwheel to ensure global install
  "BREW_DEPS=\"eigen@3 libyaml fftw ffmpeg libsamplerate libtag chromaprint\" && BREW_PC_PATHS=$(for dep in ${BREW_DEPS}; do prefix=$(brew --prefix ${dep}); printf \"%s:%s:\" \"${prefix}/lib/pkgconfig\" \"${prefix}/share/pkgconfig\"; done) && BREW_PC_PATHS=${BREW_PC_PATHS%:} && VIRTUAL_ENV=/usr/local python waf configure --pkg-config-path=\"${BREW_PC_PATHS}:${PKG_CONFIG_PATH}\"",
  "python waf",
  "python waf install"
]

test-command = "python -c \"import essentia; import essentia.standard; import essentia.streaming; from essentia.standard import MonoLoader, MetadataReader, YamlInput, Chromaprinter\""

[[tool.cibuildwheel.overrides]]
select = "*macosx_arm64*"

skip = ["*cp38*", "*cp3??t*"]

environment = { PROJECT_NAME="essentia", ESSENTIA_PROJECT_NAME="${PROJECT_NAME}", ESSENTIA_WHEEL_SKIP_3RDPARTY=1, ESSENTIA_WHEEL_ONLY_PYTHON=0, ESSENTIA_MACOSX_ARM64=1, ARCHFLAGS="-arch arm64", CFLAGS="-arch arm64", CXXFLAGS="-arch arm64", LDFLAGS="-arch arm64", MACOSX_DEPLOYMENT_TARGET=26.0, PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig" }

before-all = [
  "brew install pkg-config gcc readline sqlite gdbm libpng",
  "brew install eigen@3 libyaml fftw ffmpeg libsamplerate libtag",
  "brew install chromaprint",
  "echo 'Resolved dependency versions (brew)' && brew list --versions eigen@3 libyaml fftw ffmpeg libsamplerate libtag chromaprint",
  "echo 'Note: libyaml pkg-config module is yaml-0.1 (ABI name); resolved version can be 0.2.x'",
  "echo 'Resolved dependency versions (pkg-config)' && for dep in eigen3 yaml-0.1 fftw3f libavcodec libavformat libavutil libswresample samplerate taglib libchromaprint; do if pkg-config --exists \"$dep\"; then echo \"$dep=$(pkg-config --modversion \"$dep\")\"; else echo \"$dep=not found\"; fi; done",
  # Override VIRTUAL_ENV set by cibuildwheel to ensure global install
  "BREW_DEPS=\"eigen@3 libyaml fftw ffmpeg libsamplerate libtag chromaprint\" && BREW_PC_PATHS=$(for dep in ${BREW_DEPS}; do prefix=$(brew --prefix ${dep}); printf \"%s:%s:\" \"${prefix}/lib/pkgconfig\" \"${prefix}/share/pkgconfig\"; done) && BREW_PC_PATHS=${BREW_PC_PATHS%:} && VIRTUAL_ENV=/usr/local python waf configure --pkg-config-path=\"${BREW_PC_PATHS}:${PKG_CONFIG_PATH}\" --arch arm64 --no-msse",
  "python waf",
  "sudo python waf install",
]

# With Homebrew FFmpeg, delocate can bundle linked dylibs directly.
# For arm64, thin universal binaries to arm64 first, then run delocate.
repair-wheel-command = "python packaging/repair_macos_arm64_wheel.py {wheel} {dest_dir} {delocate_archs}"


[tool.cibuildwheel.windows]

skip = ["*cp38*", "*cp3??t*", "*-win32"]

before-build = "python -m pip install delvewheel"
repair-wheel-command = "python -m delvewheel repair --add-path \"%RUNNER_TEMP%\\vcpkg\\installed\\x64-windows\\bin\" --wheel-dir {dest_dir} {wheel}"
test-command = "python -c \"import essentia; import essentia.standard; import essentia.streaming; from essentia.standard import MonoLoader, MetadataReader, YamlInput, Chromaprinter\""
